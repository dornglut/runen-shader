[package]
name = "runen-shader"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/dornglut/runen-shader"
description = "Backend-neutral shader source and compilation semantics for Dornglut"
publish = false

[dependencies]
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in"] }
wesl = { version = "=0.5.0", default-features = false }

[[example]]
name = "exact_wgsl"
test = true
harness = false

[[example]]
name = "wesl_composition"
test = true
harness = false

[workspace]
resolver = "3"
members = ["xtask"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
